<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morphē</title>
<meta name="description" content="Morphē: one photo a day, lined up with yesterday's ghost, developed into a timelapse of how you change. Photos never leave your phone.">
<meta name="theme-color" content="#0E0909">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Morphē">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Darkroom: warm black room, red safelight glow, amber timer light, prints on off-white paper with film-strip edges. Deliberately single dark theme. */
:root{
  color-scheme:dark;
  --room:#0E0909; --bench:#181010; --tray:#221616; --line:#3A2525;
  --safe:#E0283F; --safe-glow:rgba(224,40,63,.38); --safe-soft:#3A1218;
  --amber:#F2A541; --paper:#F3ECE1; --paper-ink:#1D1414;
  --ink:#F1E4DE; --muted:#B39A94; --dim:#7D6560;
  --ok:#6FD39A; --bad:#FF6B6B;
  --f-mark:"Cormorant Garamond","Cormorant",Georgia,serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --nav-h:72px;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--room);color:var(--ink);font:15.5px/1.5 var(--f-ui);-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
/* safelight glow + grain */
body::before{content:"";position:fixed;inset:-20% -20% auto -20%;height:70vh;background:radial-gradient(closest-side,var(--safe-glow),transparent 75%);pointer-events:none;z-index:0;opacity:.55}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{position:relative;z-index:2;max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{font-family:var(--f-mark);font-style:italic;font-weight:700;font-size:38px;line-height:1;letter-spacing:.01em;color:var(--ink);text-shadow:0 0 22px var(--safe-glow)}
.mark i{color:var(--safe);font-style:inherit}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--bench);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.track{display:grid;grid-template-columns:1fr 1fr;background:var(--bench);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.track button{border:0;background:none;border-radius:10px;padding:10px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.track button[aria-pressed="true"]{background:var(--safe);color:#fff;box-shadow:0 6px 20px -6px var(--safe-glow)}
.track svg{width:18px;height:18px}
.h1{font-family:var(--f-mark);font-style:italic;font-weight:600;font-size:30px;line-height:1.1;margin:0}
.lead{color:var(--muted);margin:0}
.note{font-size:13.5px;color:var(--muted);margin:0}
.label{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.card{background:var(--bench);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;background:var(--safe);color:#fff;box-shadow:0 8px 24px -10px var(--safe-glow)}
.btn.ghost{background:var(--tray);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.amber{background:var(--amber);color:#2A1700;box-shadow:none}
.btn.small{padding:9px 13px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--tray);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-mono);font-size:24px;font-weight:600;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);font-weight:600}

/* print with film edges */
.print{position:relative;background:var(--paper);padding:10px 10px 30px;border-radius:4px;box-shadow:0 18px 40px -18px #000,0 0 0 1px rgba(0,0,0,.4);transform:rotate(-1.2deg)}
.print img,.print canvas{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#2A1E1E}
.print .cap{position:absolute;left:12px;right:12px;bottom:7px;display:flex;justify-content:space-between;font:600 11px var(--f-mono);color:var(--paper-ink);letter-spacing:.06em}
.strip{background:#120C0C;border-radius:8px;padding:14px 6px;position:relative;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip::before,.strip::after{content:"";position:absolute;left:0;right:0;height:8px;background:repeating-linear-gradient(90deg,transparent 0 6px,#3A2A26 6px 14px,transparent 14px 20px);pointer-events:none}
.strip::before{top:3px}.strip::after{bottom:3px}
.frames{display:flex;gap:6px;width:max-content}
.frames button{border:0;padding:0;background:#2A1E1E;border-radius:3px;overflow:hidden;width:64px;aspect-ratio:3/4;position:relative}
.frames img{width:100%;height:100%;object-fit:cover;display:block}
.frames span{position:absolute;left:0;right:0;bottom:0;font:600 9px var(--f-mono);color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75));padding:6px 3px 2px}

/* roll grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid button{border:0;padding:0;border-radius:6px;overflow:hidden;aspect-ratio:3/4;background:var(--tray);position:relative}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid button span{position:absolute;left:4px;bottom:3px;font:600 10px var(--f-mono);color:#fff;text-shadow:0 1px 3px #000}
.grid .gap{display:grid;place-items:center;border:1px dashed var(--line);background:none;color:var(--dim);font:600 10px var(--f-mono)}
@media (min-width:560px){.grid{grid-template-columns:repeat(5,1fr)}}

/* camera */
.cam{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column}
.cam .vf{position:relative;flex:1;display:grid;place-items:center;overflow:hidden}
.cam .box{position:relative;height:100%;max-height:calc(100vh - 190px);aspect-ratio:3/4;max-width:100vw;background:#0B0707}
.cam video,.cam .ghost,.cam .snap{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam video.mirror{transform:scaleX(-1)}
.cam .ghost{opacity:.35;pointer-events:none;mix-blend-mode:screen}
.cam svg.guide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cam svg.guide path,.cam svg.guide ellipse,.cam svg.guide line{fill:none;stroke:var(--safe);stroke-width:1.6;stroke-dasharray:6 6;opacity:.9}
.cam .ctop{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.cam .pill{background:rgba(14,9,9,.72);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font:600 12px var(--f-mono);letter-spacing:.06em}
.cam .cdown{position:absolute;inset:0;display:grid;place-items:center;font:800 120px var(--f-mono);color:#fff;text-shadow:0 0 30px var(--safe);z-index:4;pointer-events:none}
.cam .cbar{padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(14,9,9,.6),var(--room));display:flex;flex-direction:column;gap:12px}
.cam .ctl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.shutter{width:78px;height:78px;border-radius:50%;border:4px solid var(--paper);background:var(--safe);box-shadow:0 0 0 6px rgba(224,40,63,.25),0 0 40px var(--safe-glow)}
.shutter:active{transform:scale(.95)}
.cam .side{display:flex;gap:8px}
.cam .side.r{justify-content:flex-end}
.cam .sbtn{border:1px solid var(--line);background:var(--bench);border-radius:12px;padding:9px 11px;font:600 12.5px var(--f-mono)}
.slider{display:flex;align-items:center;gap:10px;font:600 12px var(--f-mono);color:var(--muted)}
.slider input{flex:1;accent-color:var(--safe)}
.camerr{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);z-index:2}

/* compare */
.cmp{position:relative;aspect-ratio:3/4;border-radius:6px;overflow:hidden;background:#2A1E1E;touch-action:none;user-select:none}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .after{clip-path:inset(0 0 0 var(--x,50%))}
.cmp .bar{position:absolute;top:0;bottom:0;left:var(--x,50%);width:2px;background:var(--paper);transform:translateX(-1px);box-shadow:0 0 12px rgba(0,0,0,.6)}
.cmp .knob{position:absolute;top:50%;left:var(--x,50%);width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:var(--paper);color:var(--paper-ink);display:grid;place-items:center;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.cmp .tag{position:absolute;top:8px;font:600 11px var(--f-mono);background:rgba(14,9,9,.75);padding:4px 8px;border-radius:6px}
.cmp .tag.l{left:8px}.cmp .tag.r{right:8px}
select{background:var(--tray);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;min-width:0;flex:1}

/* develop */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--tray);border-radius:999px;padding:7px 12px;font:600 13px var(--f-mono)}
.chip[aria-pressed="true"]{background:var(--amber);color:#2A1700;border-color:var(--amber)}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tog small{display:block;color:var(--muted);font-size:12.5px}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--tray);border:1px solid var(--line);transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch input:checked+span{background:var(--safe)}
.switch input:checked+span::after{transform:translateX(20px);background:#fff}
.devbar{height:6px;background:var(--tray);border-radius:4px;overflow:hidden}
.devbar i{display:block;height:100%;width:0;background:var(--amber)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(14,9,9,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{border:0;background:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:6px 0;border-radius:12px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--safe-soft)}
nav.tabs button[aria-current="page"] svg{color:var(--safe)}

/* sheets, lock, toast */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;background:var(--bench);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
.sheet .print{transform:none;max-width:340px;align-self:center;width:100%}
.lock{position:fixed;inset:0;z-index:50;background:var(--room);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
.dots{display:flex;gap:14px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--safe);border-color:var(--safe);box-shadow:0 0 12px var(--safe-glow)}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.keys button{height:64px;border-radius:50%;border:1px solid var(--line);background:var(--bench);font:600 24px var(--f-mono)}
.keys button.x{border:0;background:none;font-size:14px;color:var(--muted)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#toastHost{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;justify-content:center;pointer-events:none;padding:0 16px}
.toast{background:var(--paper);color:var(--paper-ink);font-weight:700;padding:11px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:420px;text-align:center}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:20px 8px}
.empty svg{width:120px;height:auto;opacity:.9}
.demo{background:var(--safe-soft);border:1px solid var(--safe);border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){.shake{animation:none}.print{transform:none}}

.install{background:linear-gradient(135deg,var(--safe-soft),var(--tray));border:1px solid var(--safe);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.install ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.install b{color:var(--paper)}
.nudge{background:var(--tray);border:1px solid var(--amber);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.nudge p{margin:0;font-size:14px}
.grid button i.nt{position:absolute;top:3px;right:4px;font-style:normal;font-size:11px;background:var(--amber);color:#2A1700;border-radius:6px;padding:0 4px;font-weight:800}
.cmpnotes{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;color:var(--muted)}
.cmpnotes div{background:var(--tray);border-radius:10px;padding:8px 10px;min-height:2.2em}
.cmpnotes b{display:block;font:600 11px var(--f-mono);color:var(--amber);letter-spacing:.06em}
.field{display:flex;flex-direction:column;gap:6px}
.field input[type=text],.field input[type=date]{background:var(--tray);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
.tour{position:fixed;inset:0;z-index:45;background:rgba(8,5,5,.86);display:flex;align-items:center;justify-content:center;padding:20px}
.tour .tcard{background:var(--bench);border:1px solid var(--line);border-radius:22px;max-width:380px;width:100%;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 0 60px var(--safe-glow)}
.tour .art{height:150px;display:grid;place-items:center;background:#120C0C;border-radius:14px;position:relative;overflow:hidden}
.tour .art svg{height:130px;width:auto}
.tdots{display:flex;gap:6px;justify-content:center}.tdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.tdots i.on{background:var(--safe);width:22px;border-radius:4px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Today</button>
  <button data-tab="roll"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8h18M3 16h18M7 4v4M12 4v4M17 4v4M7 16v4M12 16v4M17 16v4"/></svg>Roll</button>
  <button data-tab="compare"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 2v20"/><path d="M8 10l-2 2 2 2M16 10l2 2-2 2"/></svg>Compare</button>
  <button data-tab="develop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/></svg>Develop</button>
</div></nav>
<div id="camHost"></div>
<div id="sheetHost"></div>
<div id="lockHost"></div>
<div id="toastHost"></div>
<div id="live" class="sr" aria-live="polite"></div>
<input type="file" id="pickPhoto" accept="image/*" hidden>
<input type="file" id="pickBackup" accept=".zip,application/zip" hidden>

<script>
(function(){
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const short=s=>{const d=parse(s);return d.getDate()+' '+MON[d.getMonth()];};
const long=s=>{const d=parse(s);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
function toast(m){const h=$('#toastHost');h.innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML='',2800);}
const say=t=>{$('#live').textContent=t;};

/* ---------- settings (this device) ---------- */
const SKEY='morphe.settings.v1';
let S={track:'face',ghost:35,guide:true,timer:{face:0,body:10},fps:6,stamp:true,fade:true,notes:true,pin:null,lastBackup:0,backupCount:0,hideInstall:0,toured:false};
try{const v=JSON.parse(localStorage.getItem(SKEY));if(v)S=Object.assign(S,v,{timer:Object.assign({},S.timer,v.timer||{})});}catch(e){}
const saveS=()=>{try{localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){}};

/* ---------- photo store: IndexedDB on this phone only ---------- */
let dbp=null;
function db(){if(!dbp)dbp=new Promise((res,rej)=>{const r=indexedDB.open('morphe',1);r.onupgradeneeded=()=>{const s=r.result.createObjectStore('photos',{keyPath:'id'});s.createIndex('track','track');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});return dbp;}
async function tx(mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('photos',mode),s=t.objectStore('photos');let out;Promise.resolve(fn(s)).then(v=>out=v);t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});}
const reqP=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
async function allPhotos(){return tx('readonly',s=>reqP(s.getAll()));}
async function putPhoto(p){return tx('readwrite',s=>reqP(s.put(p)));}
async function delPhoto(id){return tx('readwrite',s=>reqP(s.delete(id)));}
async function clearAll(){return tx('readwrite',s=>reqP(s.clear()));}

let PH={face:[],body:[]};const urls=new Map();
const url=p=>{if(!urls.has(p.id))urls.set(p.id,URL.createObjectURL(p.blob));return urls.get(p.id);};
async function loadPhotos(){
  let all=[];try{all=await allPhotos();}catch(e){toast('This browser blocked photo storage. Try another browser.');}

const imgCache=new Map();
function loadImg(p){if(imgCache.has(p.id))return imgCache.get(p.id);const pr=new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url(p);});imgCache.set(p.id,pr);return pr;}
function drawFrame(ctx,W,H,a,b,t,p,idx,total){
  ctx.fillStyle='#120C0C';ctx.fillRect(0,0,W,H);
  const cover=(im,al)=>{if(!im)return;ctx.globalAlpha=al;const r=Math.max(W/im.width,H/im.height),w=im.width*r,h=im.height*r;ctx.drawImage(im,(W-w)/2,(H-h)/2,w,h);ctx.globalAlpha=1;};
  cover(a,1);if(b&&t>0)cover(b,t);
  if(S.stamp){const label=long(p.date);ctx.font='600 '+Math.round(W*0.042)+'px "IBM Plex Mono", monospace';ctx.textAlign='right';ctx.textBaseline='bottom';
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillText(label,W-W*0.045+2,H-W*0.045+2);ctx.fillStyle='#F2A541';ctx.fillText(label,W-W*0.045,H-W*0.045);
    ctx.textAlign='left';ctx.font='600 '+Math.round(W*0.032)+'px "IBM Plex Mono", monospace';ctx.fillStyle='rgba(243,236,225,.85)';ctx.fillText('DAY '+String(idx+1).padStart(3,'0')+' / '+total,W*0.045,H-W*0.045);}
  if(S.notes&&p.note){const fs=Math.round(W*0.045);ctx.font='700 '+fs+'px "Manrope", system-ui, sans-serif';ctx.textAlign='left';ctx.textBaseline='top';
    let t=p.note;while(ctx.measureText(t).width>W*0.86&&t.length>4)t=t.slice(0,-2);if(t!==p.note)t=t.replace(/.$/,'…');
    const tw=ctx.measureText(t).width,x=W*0.045,y=W*0.045;ctx.fillStyle='rgba(14,9,9,.72)';ctx.fillRect(x-10,y-8,tw+20,fs+16);ctx.fillStyle='#F3ECE1';ctx.fillText(t,x,y);}
}
async function wireDevelop(){
  stopPlayer();const L=list();if(L.length<3)return;
  const len=()=>{const s=L.length/S.fps+1;$('#dvLen').textContent=s<60?s.toFixed(1)+' s':Math.floor(s/60)+' min '+Math.round(s%60)+' s';};len();
  $('#fps').onclick=e=>{const b=e.target.closest('[data-fps]');if(!b)return;S.fps=+b.dataset.fps;saveS();$$('#fps .chip').forEach(c=>c.setAttribute('aria-pressed',String(+c.dataset.fps===S.fps)));len();};
  $('#stamp').onchange=e=>{S.stamp=e.target.checked;saveS();};$('#fade').onchange=e=>{S.fade=e.target.checked;saveS();};$('#notesT').onchange=e=>{S.notes=e.target.checked;saveS();};
  const cv=$('#dv'),ctx=cv.getContext('2d');player={i:0,t0:performance.now(),playing:true,raf:0};
  const imgs=await Promise.all(L.map(loadImg).map(p=>p.catch(()=>null)));
  const loop=now=>{if(!player||!document.body.contains(cv))return;
    if(player.playing){const per=1000/S.fps,el=now-player.t0,i=Math.floor(el/per)%L.length,f=(el%per)/per;
      const t=S.fade&&i<L.length-1?Math.max(0,(f-0.55)/0.45):0;drawFrame(ctx,cv.width,cv.height,imgs[i],imgs[i+1],t,L[i],i,L.length);
      $('#dvF').textContent='FRAME '+String(i+1).padStart(3,'0');$('#dvD').textContent=short(L[i].date);}
    player.raf=requestAnimationFrame(loop);};
  player.raf=requestAnimationFrame(loop);
  $('#dvPlay').onclick=()=>{player.playing=!player.playing;if(player.playing)player.t0=performance.now();$('#dvPlay').textContent=player.playing?'Pause':'Play';};
  $('#dvMake').onclick=()=>makeVideo(L,imgs);
}
function stopPlayer(){if(player){cancelAnimationFrame(player.raf);player=null;}}
function pickMime(){const c=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];if(!window.MediaRecorder)return null;for(const m of c){try{if(MediaRecorder.isTypeSupported(m))return m;}catch(e){}}return '';}
async function makeVideo(L,imgs){
  const mime=pickMime();if(mime===null){toast('This browser can’t make videos. Try Chrome or Safari.');return;}
  const cv=document.createElement('canvas');cv.width=720;cv.height=960;const ctx=cv.getContext('2d');
  drawFrame(ctx,720,960,imgs[0],null,0,L[0],0,L.length);
  const stream=cv.captureStream(30);let rec;try{rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:5e6}:{videoBitsPerSecond:5e6});}catch(e){try{rec=new MediaRecorder(stream);}catch(err){toast('This browser can’t make videos. Try Chrome or Safari.');return;}}
  const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  const btn=$('#dvMake'),bar=$('#dvBar');btn.disabled=true;btn.textContent='Developing…';bar.hidden=false;$('#dvMsg').textContent='Keep this screen open while it develops.';
  if(player)player.playing=false;
  const per=1000/S.fps,total=L.length*per+1000;rec.start(250);const t0=performance.now();
  await new Promise(res=>{const step=()=>{const el=performance.now()-t0;
      if(el>=total){res();return;}
      const i=Math.min(L.length-1,Math.floor(el/per)),f=(el%per)/per,t=S.fade&&i<L.length-1&&el<L.length*per?Math.max(0,(f-0.55)/0.45):0;
      drawFrame(ctx,720,960,imgs[i],imgs[i+1],t,L[i],i,L.length);bar.firstChild.style.width=(el/total*100).toFixed(1)+'%';
      setTimeout(step,1000/30);};step();});
  await new Promise(res=>{rec.onstop=res;rec.stop();});
  const type=(rec.mimeType||mime||'video/webm').split(';')[0],ext=type.includes('mp4')?'mp4':'webm';
  const blob=new Blob(chunks,{type}),name='morphe-'+S.track+'-'+ymd(new Date())+'.'+ext;
  btn.disabled=false;btn.textContent='Make video';bar.hidden=true;if(player){player.playing=true;player.t0=performance.now();}
  showVideo(blob,name,ext);
}
function showVideo(blob,name,ext){
  const u=URL.createObjectURL(blob),file=new File([blob],name,{type:blob.type});
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));
  sheet('<span class="label">Developed</span><video src="'+u+'" controls playsinline loop style="width:100%;border-radius:8px;background:#000"></video>'+
    '<div class="row">'+(canShare?'<button class="btn" id="vShare" style="flex:1">Share</button>':'')+'<a class="btn ghost" id="vSave" href="'+u+'" download="'+esc(name)+'" style="flex:1;text-align:center;text-decoration:none">Save video</a></div>'+
    (ext==='webm'?'<p class="note">Your browser made a .webm video. If WhatsApp won’t take it, open Morphē in Safari (iPhone) or a recent Chrome, which make .mp4.</p>':'<p class="note">Saved as '+esc(name)+'.</p>'));
  if(canShare)$('#vShare').onclick=async()=>{try{await navigator.share({files:[file],title:'Morphē timelapse'});}catch(e){}};
}

  $('#cGuide').onclick=()=>{S.guide=!S.guide;saveS();const box=$('#cbox'),g=box.querySelector('svg.guide');if(g)g.remove();if(S.guide)box.insertAdjacentHTML('beforeend',guideSVG(S.track));$('#cGuide').textContent=S.guide?'Outline on':'Outline off';};
  if($('#cGh'))$('#cGh').oninput=e=>{S.ghost=+e.target.value;$('#cGhV').textContent=S.ghost+'%';$('#cghost').style.opacity=S.ghost/100;saveS();};
  startStream();
}
const timerLabel=()=>cam.timer?'Timer '+cam.timer+'s':'Timer off';
async function startStream(){
  stopStream();const v=$('#cv');if(!v)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){camErr('This browser can’t open the camera here. Tap File to use a photo instead.');return;}
  try{cam.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:cam.facing,width:{ideal:1440},height:{ideal:1920}},audio:false});v.srcObject=cam.stream;v.classList.toggle('mirror',cam.facing==='user');$('#cerr').hidden=true;}
  catch(e){camErr(e&&e.name==='NotAllowedError'?'Camera access is blocked. Allow the camera for this site in your browser settings, or tap File to use a photo instead.':'Couldn’t open the camera. Tap File to use a photo instead.');}
}
function camErr(m){const e=$('#cerr');if(e){e.hidden=false;e.textContent=m;}}
function stopStream(){if(cam&&cam.stream){cam.stream.getTracks().forEach(t=>t.stop());cam.stream=null;}}
function closeCam(){stopStream();clearInterval(cam&&cam.cd);$('#camHost').innerHTML='';cam=null;}
function shoot(){
  if(!cam||cam.busy)return;const v=$('#cv');if(!cam.stream||!v.videoWidth){toast('Camera isn’t ready yet.');return;}
  if(cam.timer){cam.busy=true;let n=cam.timer;const el=$('#cdown');el.textContent=n;cam.cd=setInterval(()=>{n--;if(n<=0){clearInterval(cam.cd);el.textContent='';cam.busy=false;grab();}else el.textContent=n;},1000);}
  else grab();
}
function grab(){
  const v=$('#cv'),W=1080,H=1440,c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');
  const vw=v.videoWidth,vh=v.videoHeight,r=Math.max(W/vw,H/vh),w=vw*r,h=vh*r;
  if(cam.facing==='user'){ctx.translate(W,0);ctx.scale(-1,1);}
  ctx.drawImage(v,(W-w)/2,(H-h)/2,w,h);
  try{navigator.vibrate&&navigator.vibrate(40);}catch(e){}
  c.toBlob(b=>{closeCam();review(b);},'image/jpeg',0.86);
}
async function fromFile(f){
  try{const bmp=await createImageBitmap(f,{imageOrientation:'from-image'}).catch(()=>createImageBitmap(f));const W=1080,H=1440,c=document.createElement('canvas');c.width=W;c.height=H;const r=Math.max(W/bmp.width,H/bmp.height);
    c.getContext('2d').drawImage(bmp,(W-bmp.width*r)/2,(H-bmp.height*r)/2,bmp.width*r,bmp.height*r);c.toBlob(b=>review(b,true),'image/jpeg',0.86);}
  catch(e){toast('Couldn’t open that photo.');}
}
function review(blob,fromGallery){
  const u=URL.createObjectURL(blob),today=ymd(new Date());
  sheet('<span class="label">'+(fromGallery?'Add a photo':'Developing')+'</span><div class="print"><img src="'+u+'" alt="New photo"><div class="cap"><span>'+TRACK[S.track].name.toUpperCase()+'</span><span>'+short(today)+'</span></div></div>'+
    '<div class="field"><label class="note" for="rNote">Note (optional)</label><input type="text" id="rNote" maxlength="60" placeholder="e.g. 78 kg · started gym · haircut"></div>'+
    '<div class="field"><label class="note" for="rDate">Date for this photo</label><input type="date" id="rDate" value="'+today+'" max="'+today+'"></div>'+
    '<p class="note" id="rWarn"></p><div class="row"><button class="btn ghost" id="rAgain" style="flex:1">'+(fromGallery?'Cancel':'Retake')+'</button><button class="btn" id="rKeep" style="flex:2">Keep</button></div>');
  const warn=()=>{const d=$('#rDate').value;$('#rWarn').textContent=list().some(p=>p.date===d&&!p.demo)?'You already have a photo for '+long(d)+'. Keeping this one replaces it.':'';};$('#rDate').onchange=warn;warn();
  $('#rAgain').onclick=()=>{closeSheet();URL.revokeObjectURL(u);if(!fromGallery)openCam();};
  $('#rKeep').onclick=async()=>{const d=$('#rDate').value||today;
    try{for(const p of list().filter(p=>p.date===d&&!p.demo)){await delPhoto(p.id);urls.delete(p.id);imgCache.delete(p.id);}
      const note=$('#rNote').value.trim().slice(0,60);await putPhoto({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),track:S.track,date:d,blob,createdAt:Date.now(),note});
      await loadPhotos();closeSheet();tab='today';render();const n=list().length;toast(n===1?'Day one, developed.':'Frame '+n+' developed.');}
    catch(e){toast('Couldn’t save. Your phone may be out of space.');}};
}

function openPhoto(id){
  const L=list(),i=L.findIndex(p=>p.id===id),p=L[i];if(!p)return;
  sheet('<div class="print"><img src="'+url(p)+'" alt="'+long(p.date)+'"><div class="cap"><span>DAY '+String(i+1).padStart(3,'0')+'</span><span>'+long(p.date)+'</span></div></div>'+
   '<div class="field"><label class="note" for="pNote">Note</label><input type="text" id="pNote" maxlength="60" value="'+esc(p.note||'')+'" placeholder="e.g. 78 kg · started gym"></div>'+
   '<div class="field"><label class="note" for="pDate">Date</label><input type="date" id="pDate" value="'+p.date+'" max="'+ymd(new Date())+'"></div>'+

function sheet(html){$('#sheetHost').innerHTML='<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">'+html+'</div></div>';$('#scrim').onclick=e=>{if(e.target.id==='scrim')closeSheet();};}
function closeSheet(){$('#sheetHost').innerHTML='';}

/* ---------- settings sheet: PIN, backup, delete ---------- */
async function hashPin(pin){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('morphe:'+pin));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function openSettings(){
  const n=PH.face.filter(p=>!p.demo).length+PH.body.filter(p=>!p.demo).length;
  sheet('<div class="row" style="justify-content:space-between"><div class="h1">Settings</div><button class="btn small ghost" id="sClose">Close</button></div>'+
   '<section class="card"><span class="label">Privacy</span><div class="tog"><div>PIN lock<small>Asks for a 4-digit PIN when Morphē opens</small></div><label class="switch"><input type="checkbox" id="sPin"'+(S.pin?' checked':'')+' aria-label="PIN lock"><span></span></label></div>'+
   '<p class="note">Photos are stored only on this phone, in this browser. They are never uploaded. The PIN stops someone casually opening the app; it does not encrypt the photos.</p></section>'+
   '<section class="card"><span class="label">Backup · '+n+' photos</span><p class="note">Save every photo in one .zip file. Restore it on a new phone, or if you clear your browser. Keep the file somewhere private.</p><div class="row"><button class="btn amber" id="bSave" style="flex:1">Save backup</button><button class="btn ghost" id="bLoad" style="flex:1">Restore</button></div><div class="devbar" id="bBar" hidden><i></i></div></section>'+
   '<section class="card"><span class="label">Start over</span><button class="btn ghost" id="sWipe">Delete all photos</button><div id="sWipeC"></div></section>');
  $('#sClose').onclick=closeSheet;
  $('#sPin').onchange=e=>{if(e.target.checked){e.target.checked=false;pinPad('set');}else{S.pin=null;saveS();toast('PIN lock off');}};
  $('#bSave').onclick=backupSave;$('#bLoad').onclick=()=>$('#pickBackup').click();
  $('#sWipe').onclick=()=>{$('#sWipeC').innerHTML='<div class="row" style="margin-top:8px"><span class="note" style="flex:1">Delete all '+n+' photos from this phone? Save a backup first if you want them.</span><button class="btn small" id="sWipeY">Delete all</button></div>';
    $('#sWipeY').onclick=async()=>{await clearAll();urls.clear();imgCache.clear();await loadPhotos();closeSheet();render();toast('All photos deleted');};};
}
async function backupSave(){
  if(!window.JSZip){toast('Backup needs an internet connection the first time. Try again online.');return;}
  const all=[...PH.face,...PH.body].filter(p=>!p.demo);if(!all.length){toast('No photos to back up yet.');return;}
  const zip=new JSZip(),meta=[];const bar=$('#bBar');bar.hidden=false;
  all.forEach((p,i)=>{const f=p.track+'/'+p.date+'-'+p.id+'.jpg';zip.file(f,p.blob);meta.push({id:p.id,track:p.track,date:p.date,file:f,createdAt:p.createdAt,note:p.note||''});});
  zip.file('morphe.json',JSON.stringify({app:'morphe',v:1,exportedAt:new Date().toISOString(),photos:meta}));
  const blob=await zip.generateAsync({type:'blob'},m=>{bar.firstChild.style.width=m.percent.toFixed(0)+'%';});
  bar.hidden=true;const name='morphe-backup-'+ymd(new Date())+'.zip',file=new File([blob],name,{type:'application/zip'});
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000);
  S.lastBackup=Date.now();S.backupCount=all.length;saveS();toast('Backup saved: '+name);if(!$('#sClose'))render();
}
async function backupRestore(f){
  if(!window.JSZip){toast('Restore needs an internet connection the first time.');return;}
  try{const zip=await JSZip.loadAsync(f);const m=zip.file('morphe.json');if(!m)throw 0;const data=JSON.parse(await m.async('string'));if(data.app!=='morphe')throw 0;
    const have=new Set([...PH.face,...PH.body].map(p=>p.track+p.date));let added=0;
    for(const p of data.photos){if(have.has(p.track+p.date))continue;const zf=zip.file(p.file);if(!zf)continue;const blob=new Blob([await zf.async('arraybuffer')],{type:'image/jpeg'});await putPhoto({id:p.id,track:p.track,date:p.date,blob,createdAt:p.createdAt||Date.now(),note:p.note||''});added++;}
    await loadPhotos();closeSheet();render();toast(added?'Restored '+added+' photo'+(added===1?'':'s')+'.':'Nothing new in that backup.');}
  catch(e){toast('That file isn’t a Morphē backup.');}
}
function pinPad(mode){
  let entry='',first=null;
  const draw=(msg)=>{$('#lockHost').innerHTML='<div class="lock" role="dialog" aria-label="PIN"><div class="mark">Morph<i>ē</i></div><p class="lead" id="pMsg">'+esc(msg)+'</p><div class="dots" id="pDots">'+[0,1,2,3].map(i=>'<i class="'+(i<entry.length?'on':'')+'"></i>').join('')+'</div>'+
    '<div class="keys">'+[1,2,3,4,5,6,7,8,9].map(n=>'<button data-k="'+n+'">'+n+'</button>').join('')+(mode==='set'?'<button class="x" data-k="c">Cancel</button>':'<span></span>')+'<button data-k="0">0</button><button class="x" data-k="b">Delete</button></div></div>';
    $('.keys').onclick=onKey;};
  const msgs={set:'Choose a 4-digit PIN',confirm:'Type it again',open:'Enter your PIN'};
  let stage=mode==='set'?'set':'open';
  const onKey=async e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;
    if(k==='c'){$('#lockHost').innerHTML='';return;}if(k==='b'){entry=entry.slice(0,-1);draw(msgs[stage]);return;}
    if(entry.length>=4)return;entry+=k;draw(msgs[stage]);if(entry.length<4)return;
    if(stage==='set'){first=entry;entry='';stage='confirm';draw(msgs.confirm);return;}
    if(stage==='confirm'){if(entry===first){S.pin=await hashPin(entry);saveS();$('#lockHost').innerHTML='';toast('PIN lock on');if($('#sPin'))$('#sPin').checked=true;}else{entry='';first=null;stage='set';draw('Those didn’t match. Choose a PIN');$('#pDots').classList.add('shake');}return;}
    if(await hashPin(entry)===S.pin){$('#lockHost').innerHTML='';}else{entry='';draw('Wrong PIN. Try again');$('#pDots').classList.add('shake');}};
  draw(msgs[stage]);
}

/* ---------- demo photos (drawn, not real people) ---------- */
async function makeDemo(){
  const n=21,today=new Date(),face=S.track==='face';
  for(let i=0;i<n;i++){
    const c=document.createElement('canvas');c.width=540;c.height=720;const g=c.getContext('2d'),k=i/(n-1);
    const bg=g.createLinearGradient(0,0,0,720);bg.addColorStop(0,'#3B2A28');bg.addColorStop(1,'#1A1110');g.fillStyle=bg;g.fillRect(0,0,540,720);
    g.fillStyle='rgba(242,165,65,.08)';g.fillRect(380,0,160,720);
    const jit=(Math.sin(i*2.1)*4);g.fillStyle='#6B4430';
    if(face){
      g.beginPath();g.ellipse(270+jit,300,128,168,0,0,7);g.fill();
      g.fillStyle='#5A3826';g.beginPath();g.ellipse(270+jit,640,250,150,0,3.14,6.28);g.fill();g.fillRect(20+jit,640,500,90);
      g.fillStyle='#1B1110';g.beginPath();g.ellipse(270+jit,175,132,70+k*14,0,3.14,6.28);g.fill();
      g.fillStyle='rgba(27,17,16,'+(0.15+k*0.8)+')';g.beginPath();g.moveTo(150+jit,330);g.quadraticCurveTo(270+jit,520+k*40,390+jit,330);g.quadraticCurveTo(270+jit,400,150+jit,330);g.fill();
      g.fillStyle='#F3ECE1';[[225,280],[315,280]].forEach(([x,y])=>{g.beginPath();g.ellipse(x+jit,y,14,9,0,0,7);g.fill();});
      g.fillStyle='#1B1110';[[225,280],[315,280]].forEach(([x,y])=>{g.beginPath();g.arc(x+jit,y,6,0,7);g.fill();});
    }else{
      const sh=86+k*14,ws=70-k*12;g.beginPath();g.arc(270+jit,110,42,0,7);g.fill();
      g.beginPath();g.moveTo(270-sh+jit,180);g.lineTo(270+sh+jit,180);g.lineTo(270+ws+jit,400);g.lineTo(270-ws+jit,400);g.closePath();g.fill();
      g.fillRect(270-ws+jit,400,ws*2,40);g.fillStyle='#2B2F45';g.fillRect(270-ws+jit,430,ws-6,250);g.fillRect(276+jit,430,ws-6,250);
      g.fillStyle='#6B4430';g.beginPath();g.moveTo(270-sh+jit,182);g.lineTo(270-sh-24+jit,380);g.lineTo(270-sh-6+jit,384);g.lineTo(270-sh+26+jit,230);g.fill();
      g.beginPath();g.moveTo(270+sh+jit,182);g.lineTo(270+sh+24+jit,380);g.lineTo(270+sh+6+jit,384);g.lineTo(270+sh-26+jit,230);g.fill();
    }
    g.fillStyle='rgba(243,236,225,.55)';g.font='600 20px monospace';g.fillText('DEMO',22,40);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.8));const d=new Date(today);d.setDate(d.getDate()-(n-1-i)-(i>12?0:1));
    await putPhoto({id:'demo-'+S.track+'-'+i,track:S.track,date:ymd(d),blob,createdAt:Date.now(),demo:true});
  }
  await loadPhotos();render();toast('Demo photos loaded. Try Roll, Compare and Develop.');
}
async function removeDemo(){for(const p of list().filter(p=>p.demo)){await delPhoto(p.id);urls.delete(p.id);imgCache.delete(p.id);}await loadPhotos();render();}

async function persist(){try{if(navigator.storage&&navigator.storage.persist&&!(await navigator.storage.persisted()))await navigator.storage.persist();}catch(e){}}

/* ---------- events ---------- */
$('nav.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;stopPlayer();render();window.scrollTo(0,0);});
$('#app').addEventListener('click',e=>{
  const t=e.target.closest('[data-track]');if(t){S.track=t.dataset.track;saveS();stopPlayer();render();return;}
  const tg=e.target.closest('[data-tabgo]');if(tg){tab=tg.dataset.tabgo;stopPlayer();render();window.scrollTo(0,0);return;}
  const ph=e.target.closest('[data-photo]');if(ph){openPhoto(ph.dataset.photo);return;}

  if(id==='import'){$('#pickPhoto').click();return;}
  if(id==='gear'||e.target.closest('#gear')){openSettings();return;}

  if(id==='noDemo'){removeDemo();return;}
  if(id==='hideInstall'){S.hideInstall=Date.now()+3*864e5;saveS();render();return;}
  if(id==='nudgeBk'){backupSave();return;}
});
$('#pickPhoto').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)fromFile(f);e.target.value='';});
